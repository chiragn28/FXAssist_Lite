# The corpus (ADR-001). One entry per document; data/SOURCES.md is generated from this file.
#
# Licence terms were read on 2026-10-06 from each publisher's own page (licence_url):
#   CFTC       public domain, acknowledgement requested
#   ESMA       reproduction authorised provided the source is acknowledged
#   ASIC       regulatory guides, reports and newsroom items under CC BY 4.0
#   FCA        personal use only; stored copies must not be distributed (fetch-only here)
#   Wikipedia  CC BY-SA 4.0
#
# Every URL was downloaded successfully with the project's own User-Agent on 2026-10-06.
# Sites that block non-browser clients are excluded rather than worked around.


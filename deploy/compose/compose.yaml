# Local stack: data stores and Ollama. The gateway, mock LLM and observability
# services are added in Phases 2 and 3.
#
# Rules every service follows (checked by tests/test_compose.py):
#   - image (or Dockerfile base image) pinned to an exact version (docs/VERSIONS.md)
#   - host ports and bind address come from FXA_* variables (ENV-04)
#   - published only on FXA_BIND_ADDR, 127.0.0.1 by default (OBS-04)
#   - a memory limit, so the total RAM budget is known (ENV-02)
#   - runs as a non-root user with no extra capabilities (SAF-08)
#   - a healthcheck, so `docker compose up --wait` gates on readiness (DEP-04)
#
# Profiles (ENV-02): services without a profile are the "lite" set and always start.
#   llm   Ollama, the local dev model (ADR-022). `make up` enables it; `make up-lite` does not.
#   full  observability (Phase 3). `make up-full` enables llm and full.
name: fxassist

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  qdrant:
    <<: *hardening
    # The -unprivileged variant runs as uid 1000 instead of root.
    image: qdrant/qdrant:v1.19.2-unprivileged
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_QDRANT_HTTP_PORT:-6333}:6333"
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    user: "1000:1000"
    mem_limit: 512m
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp is enough to probe the port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *hardening
    image: redis:8.8.3
    # Cache and rate-limit counters are disposable (ADR-010, CAC-06): no persistence.
    # volatile-lru evicts only keys that have a TTL when memory is full.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_REDIS_PORT:-6379}:6379"
    user: "999:999"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    <<: *hardening
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${FXA_POSTGRES_USER:-fxassist}
      POSTGRES_DB: ${FXA_POSTGRES_DB:-fxassist}
      POSTGRES_PASSWORD: ${FXA_POSTGRES_PASSWORD:?set FXA_POSTGRES_PASSWORD in .env}
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 moved the volume from /var/lib/postgresql/data to /var/lib/postgresql.
      - pg_data:/var/lib/postgresql
    user: "999:999"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    <<: *hardening
    profiles: [llm]
    build:
      context: deploy/compose/ollama
    image: fxassist/ollama:0.35.1
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/ollama
    user: "1000:1000"
    # Enough to run the 3B model on CPU; with a GPU the weights sit in GPU memory instead.
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  qdrant_data:
  pg_data:
  ollama_data:

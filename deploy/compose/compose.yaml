# Local stack: data stores, the gateway, the mock LLM, Ollama, Prometheus and Grafana.
#
# Rules every service follows (checked by tests/test_compose.py):
#   - image (or Dockerfile base image) pinned to an exact version (docs/VERSIONS.md)
#   - host ports and bind address come from FXA_* variables (ENV-04)
#   - published only on FXA_BIND_ADDR, 127.0.0.1 by default (OBS-04)
#   - a memory limit, so the total RAM budget is known (ENV-02)
#   - runs as a non-root user with no extra capabilities (SAF-08)
#   - a healthcheck, so `docker compose up --wait` gates on readiness (DEP-04)
#
# Profiles (ENV-02): services without a profile are the "lite" set and always start.
#   llm   Ollama, the local dev model (ADR-022). `make up` enables it and points the gateway at
#         it; `make up-lite` does not, and the gateway uses the mock LLM instead.
#   full  Prometheus and Grafana (Phase 3). `make up` enables llm and full.
name: fxassist

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  qdrant:
    <<: *hardening
    # The -unprivileged variant runs as uid 1000 instead of root.
    image: qdrant/qdrant:v1.19.2-unprivileged
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_QDRANT_HTTP_PORT:-6333}:6333"
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    user: "1000:1000"
    mem_limit: 512m
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp is enough to probe the port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *hardening
    image: redis:8.8.3
    # Cache and rate-limit counters are disposable (ADR-010, CAC-06): no persistence.
    # volatile-lru evicts only keys that have a TTL when memory is full.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_REDIS_PORT:-6379}:6379"
    user: "999:999"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    <<: *hardening
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${FXA_POSTGRES_USER:-fxassist}
      POSTGRES_DB: ${FXA_POSTGRES_DB:-fxassist}
      POSTGRES_PASSWORD: ${FXA_POSTGRES_PASSWORD:?set FXA_POSTGRES_PASSWORD in .env}
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 moved the volume from /var/lib/postgresql/data to /var/lib/postgresql.
      - pg_data:/var/lib/postgresql
    user: "999:999"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    <<: *hardening
    profiles: [llm]
    build:
      context: deploy/compose/ollama
    image: fxassist/ollama:0.35.1
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/ollama
    user: "1000:1000"
    # Enough to run the 3B model on CPU; with a GPU the weights sit in GPU memory instead.
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Misbehaving OpenAI-compatible server for drills, CI and the lite stack (ADR-003, LLM-09).
  mock-llm:
    <<: *hardening
    build:
      context: .
      dockerfile: services/mock_llm/Dockerfile
    image: fxassist/mock-llm:0.5.0
    environment:
      FXA_MOCK_MODELS: mock-llm
      # Realistic-looking timing and token usage, so dashboards have something to show.
      FXA_MOCK_CONFIG: '{"flavour": "ollama", "first_token_ms": 150, "token_ms": 15}'
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_MOCK_LLM_PORT:-8081}:8080"
    user: "10001:10001"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    <<: *hardening
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    image: fxassist/gateway:0.5.0
    # No depends_on: the gateway starts in any order and reports what is missing on /readyz
    # (DEP-04). The compose healthcheck is liveness (/healthz): on a fresh clone the collection
    # is not ingested yet and the model may not be pulled, which `up --wait` must not wait for.
    # Scripts that need a ready gateway poll /readyz (make demo, make drill).
    environment:
      FXA_QDRANT_URL: http://qdrant:6333
      FXA_REDIS_URL: redis://redis:6379/0
      FXA_POSTGRES_HOST: postgres
      FXA_POSTGRES_PORT: "5432"
      FXA_POSTGRES_USER: ${FXA_POSTGRES_USER:-fxassist}
      FXA_POSTGRES_DB: ${FXA_POSTGRES_DB:-fxassist}
      FXA_POSTGRES_PASSWORD: ${FXA_POSTGRES_PASSWORD:?set FXA_POSTGRES_PASSWORD in .env}
      FXA_LLM_BASE_URL: ${FXA_GATEWAY_LLM_BASE_URL:-http://mock-llm:8080/v1}
      FXA_LLM_MODEL: ${FXA_GATEWAY_LLM_MODEL:-mock-llm}
      FXA_CACHE_ENABLED: ${FXA_CACHE_ENABLED:-true}
      # Metrics listen inside the compose network only; this port is not published (OBS-04).
      FXA_METRICS_HOST: 0.0.0.0
      FXA_METRICS_PORT: "9464"
      # Optional traces to Langfuse Cloud (free tier) or any OTLP endpoint (ADR-012, DEP-03).
      FXA_LANGFUSE_PUBLIC_KEY: ${FXA_LANGFUSE_PUBLIC_KEY:-}
      FXA_LANGFUSE_SECRET_KEY: ${FXA_LANGFUSE_SECRET_KEY:-}
      FXA_LANGFUSE_HOST: ${FXA_LANGFUSE_HOST:-https://cloud.langfuse.com}
      FXA_TRACE_CONTENT: ${FXA_TRACE_CONTENT:-false}
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_GATEWAY_PORT:-8000}:8000"
    user: "10001:10001"
    # fastembed + ONNX Runtime + the agent (measured: see docs/VERSIONS.md, Phase 2).
    mem_limit: 1g
    # API-08: compose sends SIGTERM, then waits this long before SIGKILL. Longer than the
    # gateway's own 30 s grace period, so in-flight requests can finish.
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  prometheus:
    <<: *hardening
    profiles: [full]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_PROMETHEUS_PORT:-9090}:9090"
    user: "65534:65534"  # nobody, the image's default
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    <<: *hardening
    profiles: [full]
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${FXA_GRAFANA_ADMIN_PASSWORD:?set FXA_GRAFANA_ADMIN_PASSWORD in .env}
      # Local convenience: dashboards are viewable without logging in (bound to localhost).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fxassist.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${FXA_BIND_ADDR:-127.0.0.1}:${FXA_GRAFANA_PORT:-3000}:3000"
    user: "472:0"  # the image's grafana user
    # Measured 217 MiB right after start with one dashboard (2026-10-07); 256m left too little room.
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  qdrant_data:
  pg_data:
  ollama_data:
  prometheus_data:
  grafana_data:

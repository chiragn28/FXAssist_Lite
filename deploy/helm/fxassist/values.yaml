# Base values (K8S-09): everything is set here. Environment files (values-kind.yaml,
# values-ci.yaml) override only the few keys that differ, and CI diffs the rendered output.
#
# K8S-06: no secrets in values files. The chart reads them from an existing Secret
# (`secretName`), created outside Helm by scripts/kind-secrets.sh from your local .env.
secretName: fxassist-secrets

images:
  gateway: fxassist/gateway:0.4.0
  mockLlm: fxassist/mock-llm:0.4.0
  watchdog: fxassist/watchdog:0.4.0
  qdrant: qdrant/qdrant:v1.19.2-unprivileged
  redis: redis:8.8.3
  postgres: postgres:18.6
  pullPolicy: IfNotPresent

gateway:
  replicas: 2
  service:
    type: ClusterIP
    nodePort: null
  # K8S-02: requests reserve capacity for scheduling; the memory limit is the OOM line.
  # Measured 349 MiB resident in compose (docs/VERSIONS.md).
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  # K8S-01: loading the embedding model takes seconds (more on a busy node). The startup probe
  # allows up to failureThreshold x periodSeconds = 180 s before liveness takes over.
  startupProbe: {periodSeconds: 5, failureThreshold: 36, timeoutSeconds: 3}
  readinessProbe: {periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 8}
  livenessProbe: {periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3}
  # K8S-07 / API-08: the pod stays in the Service while kube-proxy catches up (preStop), then
  # uvicorn drains for up to 30 s. The grace period covers both.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 45
  pdbMinAvailable: 1
  hpa: {enabled: true, minReplicas: 2, maxReplicas: 4, cpuUtilization: 70}
  env:
    FXA_LLM_MODEL: mock-llm
    FXA_CACHE_ENABLED: "true"
    FXA_MAX_CONCURRENT_RUNS: "4"
    FXA_RATE_LIMIT_PER_MINUTE: "30"
    FXA_LOG_LEVEL: INFO
    FXA_DEBUG_STARTUP_DELAY_S: "0"

mockLlm:
  # Realistic timing and token usage (same as compose).
  config: '{"flavour": "ollama", "first_token_ms": 150, "token_ms": 15}'
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}

qdrant:
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}

postgres:
  user: fxassist
  database: fxassist
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

ingest:
  enabled: true
  # Downloads the public documents from data/sources.yaml (needs internet), then embeds them.
  args: ["ingest"]
  # Embedding batch size. 64 (the CLI default) was OOMKilled at 1.5 GiB on kind (2026-10-07):
  # ONNX Runtime's attention memory grows with batch x sequence length squared.
  embedBatchSize: 16
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 1536Mi}

watchdog:
  enabled: true
  schedule: "* * * * *"
  failuresToRestart: 3
  cooldownSeconds: 600
  maxRestartsPerHour: 2
  slowThresholdSeconds: 20
  timeoutSeconds: 30
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

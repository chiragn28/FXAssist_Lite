{{- $q := dict "root" . "component" "qdrant" -}}
{{- $r := dict "root" . "component" "redis" -}}
{{- $p := dict "root" . "component" "postgres" -}}
# Lightweight single-replica data stores for kind, with trimmed resources (Phase 4 scope).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fx.name" $q }}
  labels: {{- include "fx.labels" $q | nindent 4 }}
spec:
  serviceName: {{ include "fx.name" $q }}
  replicas: 1
  selector:
    matchLabels: {{- include "fx.selector" $q | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fx.labels" $q | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000}
      containers:
        - name: qdrant
          image: {{ .Values.images.qdrant }}
          imagePullPolicy: IfNotPresent
          {{- include "fx.containerSecurity" (dict "uid" 1000) | nindent 10 }}
          ports:
            - {name: http, containerPort: 6333}
          resources: {{- toYaml .Values.qdrant.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /qdrant/storage}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: {{ .Values.qdrant.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fx.name" $q }}
  labels: {{- include "fx.labels" $q | nindent 4 }}
spec:
  selector: {{- include "fx.selector" $q | nindent 4 }}
  ports:
    - {name: http, port: 6333, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fx.name" $r }}
  labels: {{- include "fx.labels" $r | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "fx.selector" $r | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fx.labels" $r | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          imagePullPolicy: IfNotPresent
          # Disposable cache and counters (ADR-010, CAC-06): no persistence.
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
          {{- include "fx.containerSecurity" (dict "uid" 999 "readOnly" true) | nindent 10 }}
          ports:
            - {name: redis, containerPort: 6379}
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fx.name" $r }}
  labels: {{- include "fx.labels" $r | nindent 4 }}
spec:
  selector: {{- include "fx.selector" $r | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fx.name" $p }}
  labels: {{- include "fx.labels" $p | nindent 4 }}
spec:
  serviceName: {{ include "fx.name" $p }}
  replicas: 1
  selector:
    matchLabels: {{- include "fx.selector" $p | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fx.labels" $p | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: IfNotPresent
          {{- include "fx.containerSecurity" (dict "uid" 999) | nindent 10 }}
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: postgres-password}
          ports:
            - {name: postgres, containerPort: 5432}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 10
          volumeMounts:
            # PostgreSQL 18 keeps its data under /var/lib/postgresql (docs/VERSIONS.md).
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fx.name" $p }}
  labels: {{- include "fx.labels" $p | nindent 4 }}
spec:
  selector: {{- include "fx.selector" $p | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}

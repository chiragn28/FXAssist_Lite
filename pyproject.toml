[project]
name = "fxassist-lite"
version = "0.0.1"
description = "Zero-cost self-hosted LLM platform answering questions over public forex/CFD documentation."
readme = "README.md"
requires-python = ">=3.11"
# Each service is a uv workspace member with its own dependencies (ADR-021), so every
# image installs only what it needs. The root depends on them for local development.
dependencies = ["fxassist-agent", "fxassist-gateway", "fxassist-mock-llm", "fxassist-watchdog"]

[dependency-groups]
dev = [
    # ruff must match the rev in .pre-commit-config.yaml, or `make lint` and the
    # commit hook disagree about formatting.
    "ruff==0.16.10",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "pyyaml>=6.0.3",
    "fakeredis[lua]>=2.39.0",  # Redis in offline gateway tests, including the Lua rate limiter
]

[tool.uv]
# The repo root is a workspace container, not an installable package.
package = false
required-version = ">=0.8.4"

[tool.uv.workspace]
members = ["services/agent", "services/gateway", "services/mock_llm", "services/watchdog"]

[tool.uv.sources]
fxassist-agent = { workspace = true }
fxassist-gateway = { workspace = true }
fxassist-mock-llm = { workspace = true }
fxassist-watchdog = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated from notebooks/build_notebook.py, whose cells are checked by bench/tests.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade
    "S",   # bandit: security smells
    "SIM", # simplifications
]
# `ruff format` wraps code to line-length; the long lines left are prompt text and regexes,
# where a line break would change what the model sees or hurt readability.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fxassist_agent", "fxassist_gateway", "fxassist_mock_llm", "fxassist_watchdog", "bench", "conftest", "agent_helpers", "gw_helpers"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run subprocesses on purpose.
"**/tests/**" = ["S101", "S603", "S607"]
# Operator scripts call docker, kubectl and helm on purpose.
"scripts/**" = ["S603", "S607"]
# The GPU lab launches vLLM, pip and nvidia-smi on purpose.
"bench/lab.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests", "services/agent/tests", "services/gateway/tests", "services/mock_llm/tests", "services/watchdog/tests", "bench/tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]  # so tests can import bench/ and scripts/ helpers
filterwarnings = [
    # In-memory Qdrant (tests only) ignores payload indexes; the server uses them.
    "ignore:Payload indexes have no effect:UserWarning",
]

[project]
name = "fxassist-lite"
version = "0.0.1"
description = "Zero-cost self-hosted LLM platform answering questions over public forex/CFD documentation."
readme = "README.md"
requires-python = ">=3.11"
# Phase 0 has no runtime code. Each service gets its own dependencies when it is built
# (Phase 1 onwards), added as uv workspace members so every image installs only what it needs.
dependencies = []

[dependency-groups]
dev = [
    # ruff must match the rev in .pre-commit-config.yaml, or `make lint` and the
    # commit hook disagree about formatting.
    "ruff==0.16.10",
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "pyyaml>=6.0.3",
]

[tool.uv]
# The repo root is a workspace container, not an installable package.
package = false
required-version = ">=0.8.4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade
    "S",   # bandit: security smells
    "SIM", # simplifications
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and run subprocesses on purpose.
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

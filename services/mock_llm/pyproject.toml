[project]
name = "fxassist-mock-llm"
version = "0.1.0"
description = "Configurable, misbehaving OpenAI-compatible server for CI and kind (ADR-003, LLM-09)."
requires-python = ">=3.11"
# Versions verified on 2026-10-06 (docs/VERSIONS.md); exact pins live in uv.lock.
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
fxassist-mock-llm = "fxassist_mock_llm.app:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.13"]
build-backend = "uv_build"

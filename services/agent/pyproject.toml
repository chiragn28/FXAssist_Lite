[project]
name = "fxassist-agent"
version = "0.1.0"
description = "FXAssist Lite RAG core: ingestion, retrieval and the LangGraph agent."
requires-python = ">=3.11"
# Versions verified on 2026-10-06 (docs/VERSIONS.md); exact pins live in uv.lock.
dependencies = [
    "langgraph>=1.2.14",                 # agent control flow (ADR-007)
    "langchain-text-splitters>=1.1.3",   # chunking only (ADR-007)
    "qdrant-client>=1.19.1",             # vector store (ADR-008)
    "fastembed>=0.8.1",                  # bge-small on ONNX Runtime (ADR-009, ADR-023)
    "pypdf>=6.19.0",                     # PDF text extraction
    "trafilatura>=2.3.0",                # HTML main-content extraction (DAT-05)
    "httpx>=0.28.1",                     # downloads and the OpenAI-compatible LLM client
    "pydantic-settings>=2.15.0",         # FXA_* configuration from env and .env
    "pyyaml>=6.0.3",                     # source registry and eval set
]

[project.scripts]
fxassist = "fxassist_agent.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.13"]
build-backend = "uv_build"

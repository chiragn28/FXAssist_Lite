# Prometheus for the local stack (ADR-012). Scrapes over the compose network only: the
# gateway's metrics port is never published to the host (OBS-04).
global:
  scrape_interval: 5s      # short, so a small local load shows up within seconds
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9464"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
